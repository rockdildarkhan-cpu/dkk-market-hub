name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: "DKK market hub"

      - name: Build APK
        run: flutter build apk --release
        working-directory: "DKK market hub"

      - uses: actions/upload-artifact@v4
        with:
          name: dkk-market-hub-apk
          path: "DKK market hub/build/app/outputs/flutter-apk/app-release.apk"
